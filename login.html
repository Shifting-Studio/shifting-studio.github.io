
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Login | Shifting Studio</title>

  <style>
    body {
      background: #f5f6f0;
      color: #405b46;
      font-family: Georgia, serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
    }

    .login-card {
      background: #fffefa;
      padding: 40px;
      border-radius: 18px;
      width: min(350px, 85vw);
      box-shadow: 0 8px 35px #304d3010;
      text-align: center;
    }

    h1 {
      font-weight: normal;
      margin-bottom: 8px;
    }

    p { color: #899789; }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      box-sizing: border-box;
      font: inherit;
    }

    input {
      border: 1px solid #dce5db;
      background: white;
    }

    button {
      background: #55745c;
      border: none;
      color: white;
      cursor: pointer;
    }

    button:hover { background: #405c47; }

    #message {
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <h1>✧ Shifting Studio</h1>
    <p>Your worlds, beautifully kept.</p>

    <form id="login-form">
      <input
        id="email"
        type="email"
        placeholder="Email address"
        autocomplete="email"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        minlength="6"
        required
      >

      <button type="submit" id="login">
        Log In
      </button>

      <button type="button" id="signup">
        Create Account
      </button>
    </form>

    <p id="message" role="status"></p>
  </main>

  <script type="module">
    import { supabase } from "./js/supabase.js";

    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const message = document.getElementById("message");
    const form = document.getElementById("login-form");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "Logging in...";

      const { error } =
        await supabase.auth.signInWithPassword({
          email: email.value,
          password: password.value
        });

      if (error) {
        message.textContent = error.message;
        return;
      }

      window.location.href = "index.html";
    });

    document.getElementById("signup")
      .addEventListener("click", async () => {
        if (!form.reportValidity()) return;

        message.textContent = "Creating account...";

        const { error } =
          await supabase.auth.signUp({
            email: email.value,
            password: password.value,
            options: {
              emailRedirectTo:
                "https://shifting-studio.github.io/"
            }
          });

        message.textContent = error
          ? error.message
          : "Check your email to confirm your account.";
      });
  </script>
</body>
</html>
